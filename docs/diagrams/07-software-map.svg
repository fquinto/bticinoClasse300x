<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="t d">
  <title id="t">Software map</title>
  <desc id="d">Three zones. On your computer: the firmware builder, the flasher and the legacy scripts, used once. Inside the intercom: BTicino's own software, left untouched (openserver, bt_vct, bt_av_media, Flexisip, the touchscreen UI), next to what this project adds (bticino_bridge, SSH access and boot patches). In your home: Home Assistant over MQTT, live video over RTSP, Apple Home over HomeKit and a web dashboard.</desc>
  <style>
    .bg{fill:#0f1720}
    .zone{fill:#131d28;stroke:#2f4256;stroke-width:1.5;stroke-dasharray:6 5}
    .box{fill:#1b2a3a;stroke:#4aa3ff;stroke-width:2}
    .native{fill:#221b2f;stroke:#a371f7;stroke-width:2}
    .ha{fill:#132235;stroke:#3fb950;stroke-width:2}
    .mid{fill:#102a2a;stroke:#2bb3b3;stroke-width:2}
    .warn{fill:#2a2110;stroke:#d29922;stroke-width:2}
    .t{fill:#e6edf3;font-family:sans-serif;font-size:15px;text-anchor:middle}
    .s{fill:#8b98a5;font-family:sans-serif;font-size:12px;text-anchor:middle}
    .l{fill:#8b98a5;font-family:sans-serif;font-size:12px;text-anchor:start}
    .code{fill:#9fe0b0;font-family:monospace;font-size:12px;text-anchor:middle}
    .h{fill:#e6edf3;font-family:sans-serif;font-size:14px;font-weight:bold;text-anchor:middle}
    .cap{fill:#cdd7e0;font-family:sans-serif;font-size:14px;text-anchor:middle}
    .ln{stroke:#8b98a5;stroke-width:2;fill:none;marker-end:url(#a)}
    .ln2{stroke:#8b98a5;stroke-width:2;fill:none;marker-end:url(#a);marker-start:url(#a)}
    .bus{stroke:#a371f7;stroke-width:4;fill:none}
    .dash{stroke:#d29922;stroke-width:2;stroke-dasharray:6 4;fill:none;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b98a5"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="610"/>
  <text class="cap" x="600" y="34">What each piece of software does, and where it runs</text>

  <rect class="zone" x="20" y="56" width="300" height="470" rx="12"/>
  <text class="h" x="170" y="84">On your computer (used once)</text>
  <rect class="box" x="40" y="104" width="260" height="96" rx="8"/>
  <text class="t" x="170" y="134">Firmware builder</text>
  <text class="s" x="170" y="156">opens your official firmware file</text>
  <text class="s" x="170" y="174">and adds SSH + the bridge</text>
  <rect class="box" x="40" y="222" width="260" height="96" rx="8"/>
  <text class="t" x="170" y="252">Flasher</text>
  <text class="s" x="170" y="274">writes the new image over USB</text>
  <text class="s" x="170" y="292">today MyHOME Suite; Go tool in progress</text>
  <rect class="box" x="40" y="340" width="260" height="78" rx="8"/>
  <text class="t" x="170" y="370">Legacy scripts</text>
  <text class="s" x="170" y="392">the original manual method</text>

  <rect class="zone" x="350" y="56" width="500" height="470" rx="12"/>
  <text class="h" x="600" y="84">Inside the intercom (ARM Linux)</text>
  <text class="s" x="475" y="108">BTicino's own software, untouched</text>
  <rect class="native" x="370" y="118" width="210" height="58" rx="8"/>
  <text class="t" x="475" y="142">openserver</text>
  <text class="s" x="475" y="161">OpenWebNet command server</text>
  <rect class="native" x="370" y="186" width="210" height="58" rx="8"/>
  <text class="t" x="475" y="210">bt_vct</text>
  <text class="s" x="475" y="229">handles door calls</text>
  <rect class="native" x="370" y="254" width="210" height="58" rx="8"/>
  <text class="t" x="475" y="278">bt_av_media</text>
  <text class="s" x="475" y="297">audio and video of the call</text>
  <rect class="native" x="370" y="322" width="210" height="58" rx="8"/>
  <text class="t" x="475" y="346">Flexisip</text>
  <text class="s" x="475" y="365">SIP proxy (calls to phones)</text>
  <rect class="native" x="370" y="390" width="210" height="58" rx="8"/>
  <text class="t" x="475" y="414">Touchscreen UI</text>
  <text class="s" x="475" y="433">screen, keys and LEDs</text>

  <text class="s" x="725" y="108">Added by this project</text>
  <rect class="mid" x="620" y="118" width="210" height="194" rx="10"/>
  <text class="h" x="725" y="146">bticino_bridge</text>
  <text class="s" x="725" y="170">watches the bus and the calls,</text>
  <text class="s" x="725" y="188">publishes them to your home,</text>
  <text class="s" x="725" y="206">and takes commands back</text>
  <text class="code" x="725" y="236">listens on :20000</text>
  <text class="code" x="725" y="254">sends via localhost</text>
  <text class="s" x="725" y="282">never competes with the</text>
  <text class="s" x="725" y="298">native software</text>
  <rect class="mid" x="620" y="322" width="210" height="58" rx="8"/>
  <text class="t" x="725" y="346">SSH access</text>
  <text class="s" x="725" y="365">maintenance shell</text>
  <rect class="mid" x="620" y="390" width="210" height="58" rx="8"/>
  <text class="t" x="725" y="414">Boot patches</text>
  <text class="s" x="725" y="433">autostart and firewall rules</text>
  <path class="ln2" d="M583,215 L617,215"/>
  <text class="s" x="600" y="482">The bridge only listens and sends short local commands:</text>
  <text class="s" x="600" y="500">the intercom keeps working exactly as before.</text>

  <rect class="zone" x="880" y="56" width="300" height="470" rx="12"/>
  <text class="h" x="1030" y="84">In your home</text>
  <rect class="ha" x="900" y="104" width="260" height="84" rx="8"/>
  <text class="t" x="1030" y="138">Home Assistant</text>
  <text class="s" x="1030" y="160">doorbell, lock, sensors (MQTT)</text>
  <rect class="ha" x="900" y="206" width="260" height="84" rx="8"/>
  <text class="t" x="1030" y="240">Live video and audio</text>
  <text class="s" x="1030" y="262">RTSP stream, shown through go2rtc</text>
  <rect class="ha" x="900" y="308" width="260" height="84" rx="8"/>
  <text class="t" x="1030" y="342">Apple Home</text>
  <text class="s" x="1030" y="364">doorbell and lock (HomeKit)</text>
  <rect class="ha" x="900" y="410" width="260" height="84" rx="8"/>
  <text class="t" x="1030" y="444">Web dashboard</text>
  <text class="s" x="1030" y="466">settings and logs, port 8082</text>

  <path class="ln" d="M322,270 L347,270"/>
  <path class="ln" d="M832,180 L897,148"/>
  <path class="ln" d="M832,205 L897,246"/>
  <path class="ln" d="M832,230 L897,346"/>
  <path class="ln" d="M832,255 L897,448"/>
  <text class="s" x="335" y="548">USB, one time</text>
  <text class="s" x="865" y="548">Wi-Fi / LAN, always on</text>

  <rect class="box" x="290" y="574" width="14" height="14" rx="3"/><text class="l" x="310" y="586">your computer</text>
  <rect class="native" x="430" y="574" width="14" height="14" rx="3"/><text class="l" x="450" y="586">BTicino's own software</text>
  <rect class="mid" x="630" y="574" width="14" height="14" rx="3"/><text class="l" x="650" y="586">added by this project</text>
  <rect class="ha" x="810" y="574" width="14" height="14" rx="3"/><text class="l" x="830" y="586">your home</text>
</svg>
