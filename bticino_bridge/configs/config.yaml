# BTicino Bridge - Configuración Única y Completa
# Versión: v0.14.1
# Última actualización: 2026-03-26
#
# ESTE ES EL ÚNICO ARCHIVO DE CONFIGURACIÓN QUE SE USA
# Los demás archivos en configs/ son solo ejemplos históricos
# Features v0.14.1: QML→Bridge→MQTT sync (device config, ringtones, volumes, display)

# ==================== BRIDGE ====================
bridge:
  name: "BTicino Bridge Enhanced"
  version: "0.14.1"
  log_level: "debug"  # debug, info, warn, error

# ==================== OPENWEBNET ====================
openwebnet:
  host: "127.0.0.1"
  port: 30006
  timeout: 5000ms
  retry_attempts: 3
  retry_delay: 1000ms
  # Direcciones de bus (abrir puerta / luz de escalera). Déjalas vacías: el
  # bridge las lee del conf.xml del equipo. Rellénalas solo para forzarlas.
  door_address: ""
  light_address: ""

# ==================== SIP ====================
sip:
  enabled: true
  local_host: "127.0.0.1"
  local_port: 5060
  server_host: "127.0.0.1"  # Flexisip local
  server_port: 5060
  transport: "udp"  # tcp, udp, tls - TCP local al flexisip da timeout; UDP funciona
  domain: ""  # set in secrets.yaml
  username: "webrtc"          # Per slyoldfox: register as webrtc@domain
  password: ""  # set in secrets.yaml
  dev_addr: "20"
  use_ha1: true
  insecure_tls: false
  sip_target: "c300x"         # INVITE target: c300x@domain (the intercom)

  # Contestador SIP bajo demanda desde HA (F1). Fail-closed: enabled=false por
  # defecto. El deploy NO pushea config.yaml — hay que dar de alta este bloque
  # a mano en el device (ver docs/answerer-setup.md) tras registrar la ruta con
  # scripts/setup_answerer_route.sh.
  answerer:
    enabled: false          # master switch F1 (poner true en el device tras dar de alta el route)
    user: "bridge"
    audio_port: 10100
    video_port: 10102       # -1 = rechazar m=video (audio-only)
    max_call_seconds: 120
    ring_timeout_seconds: 70 # guarda de timbre: sin contestar ni CANCEL, cierra con 480 (default 70, como la app 1.17.3)
    talk_enabled: false     # F2: hablar desde HA (micro→go2rtc :40004→ffmpeg SRTP→placa); poner true en el device
    talk_keepalive: false   # subida de audio continua (silencio speex si el micro calla) para que la placa abra el audio de bajada; requiere talk_enabled
    route_file: "/etc/flexisip/users/route_ext.conf"

# ==================== MQTT ====================
mqtt:
  enabled: true
  host: "192.168.1.3"
  port: 1883
  username: ""  # set in secrets.yaml
  password: ""  # set in secrets.yaml
  client_id: "bticino_bridge"
  topic_prefix: "bticino"
  # Botones de reinicio en HA (sección Configuration): reiniciar el bridge y
  # reiniciar el dispositivo. DESACTIVADO por defecto (el reboot reinicia todo
  # el videoportero). Ponlo a true para exponerlos.
  enable_system_buttons: false

# ==================== WEB DASHBOARD ====================
web:
  enabled: true
  port: 8082
  static_dir: "web/static"
  templates_dir: "web/templates"

# ==================== HOMEKIT ====================
homekit:
  enabled: true
  name: "BTicino Bridge"
  manufacturer: "BTicino"
  model: "Classe 300X"
  port: "8081"
  pin: ""  # set in secrets.yaml
  storage_path: "./homekit_data"

# ==================== HARDWARE ====================
hardware:
  enabled: true
  input_device: "/dev/input/event0"
  gpio_monitoring: true
  i2c_scanning: false
  polling_interval: 100ms

# ==================== LOGGING ====================
logging:
  level: "debug"
  file: "/var/log/bticino_bridge.log"
  max_size: "10MB"
  max_files: 5

# ==================== STREAMING (RTSP/WebRTC) ====================
streaming:
  enabled: true
  rtsp_port: 6554
  webrtc_enabled: false
  webrtc_port: 8889
  recording_path: "/home/bticino/cfg/extra/recordings"
  max_duration: 60  # segundos
  auto_stop_on_last_client: true
  # SEGURIDAD: activación de vídeo bajo demanda (self-INVITE del RTSP, arranque
  # automático al pulsar el timbre y snapshots). DESACTIVADO por defecto: activar
  # vídeo compite con el firmware nativo y puede provocar inestabilidad/reinicio.
  # Ponlo a true SOLO cuando el pipeline de vídeo esté validado en tu equipo.
  video_on_demand: false
  # Backend de vídeo de la cámara (solo aplica si video_on_demand: true):
  #   avmedia   -> comando *7*300: bt_av_media duplica su RTP hacia nosotros
  #                (cooperativo con el firmware nativo; no compite por /dev/video0)
  #   gstreamer -> pipeline GStreamer directo con la VPU (compite con el nativo,
  #                puede fallar con "Internal data stream error" en frío)
  #   auto      -> intenta avmedia y cae a gstreamer si no fluye RTP
  video_backend: "avmedia"
  # Vídeo en vivo durante una llamada entrante a NUESTRA unidad, por espejo
  # pasivo (tap del leg de vídeo nativo en lo:5007 hacia el relay). No envía
  # ningún comando al bus; independiente de video_on_demand.
  live_on_call: true
  # Audio en vivo de la puerta durante una llamada: mismo espejo pasivo que
  # live_on_call pero del leg de audio nativo (tap lo:5000 -> relay 10000 del
  # RTSP). Sin CallActiveMarker (no dispara self-INVITE) ni comandos al bus.
  live_audio_on_call: true

# ==================== NETWORK ====================
network:
  ntp:
    enabled: true
    server: "pool.ntp.org"
    port: 123
  dns:
    servers:
      - "192.168.1.1"
      - "8.8.8.8"
  firewall:
    block_telemetry: true  # Bloquear telemetría a BTicino
    block_cloud: false     # Bloquear cloud Netatmo
    allow_updates: false   # Permitir actualizaciones automáticas

# ==================== SERVERS EXTERNOS ====================
servers:
  cloud:
    enabled: false
    host: "nv2-bncx.netatmo.net"
    port: 25050
    protocol: "tcp"
    description: "Netatmo Cloud"
    required: false
  logging:
    enabled: false
    host: "log.bs.iotleg.com"
    port: 5001
    protocol: "udp"
    description: "BTicino Log Server"
    required: false
  updates:
    enabled: false
    host: "n3tfw.blob.core.windows.net"
    port: 443
    protocol: "https"
    description: "Firmware Updates (Azure)"
    required: false
  sip_official:
    enabled: false
    host: "sipserver.bs.iotleg.com"
    port: 5061
    protocol: "tls"
    description: "BTicino Official SIP Server"
    required: false

# ==================== NOTIFICACIONES ====================
notifications:
  mqtt:
    enabled: true
    topic: "bticino/notifications"
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password: ""
    from: ""
    to: ""
  pushover:
    enabled: false
    api_key: ""
    user_key: ""
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

# ==================== PRIVACIDAD ====================
privacy:
  block_external_telemetry: true
  block_log_server: true
  block_cloud: false
  disable_auto_updates: true
  local_logging: true

# ==================== SEGURIDAD ====================
security:
  # Basic Auth para TODO el dashboard y la API (incluye /api/config, que
  # contiene contraseñas en claro). Activado sin web_password → el servidor
  # responde 503 (fail-closed). El navegador pedirá login una sola vez.
  web_auth_required: true
  web_username: ""  # set in secrets.yaml
  web_password: ""  # set in secrets.yaml
  web_https_enabled: false  # Habilitar HTTPS
  api_rate_limit: 100       # Requests por minuto
  config_audit_log: true    # Log de cambios de configuración

# ==================== BLOQUEOS ADICIONALES ====================
additional_locks:
  # - name: "Puerta Trasera"
  #   where: 21
  # - name: "Puerta Lateral"
  #   where: 22

# ==================== CLASIFICADOR DE ACCESOS ====================
# Clasifica cada apertura del portal como telefonillo/llave correlacionando con
# timbres/llamadas previos. Solo escucha el bus interno; no envía comandos.
access:
  enabled: true
  correlation_window: 30s      # apertura dentro de este tiempo tras timbre/llamada → "telefonillo"
  max_hold_wait: 8s            # cuánto esperar al cierre para medir la duración del pulso
  duration_visitor_max: 3500ms # duración ≤ → rango "visita" (solo ajusta la CONFIANZA, no la etiqueta)

# ==================== UDP PROXY ====================
udp_proxy:
  enabled: false
  listen_port: 40004
  target_port: 4000

# ==================== AUDIO FULL-DUPLEX ====================
# Audio full-duplex en la pata propia del bridge (oír + hablar con la puerta).
# Fail-closed: si se omite el bloque, queda desactivado.
audio:
  duplex_enabled: true
  duplex_sink_path: "/home/bticino/cfg/extra/recordings/door_audio.wav"
  # Espejo pasivo del audio de bajada nativo (tap lo:5000, sdd
  # 2026-08-21-audio-tap-5000). Fail-closed: si se omite, queda desactivado.
  listen_tap_enabled: true
  # Sink WAV dedicado del oído pasivo (distinto de duplex_sink_path, para no
  # compartir archivo con la pata duplex).
  listen_sink_path: "/home/bticino/cfg/extra/recordings/door_audio_listen.wav"

# ==================== SUPERVIVENCIA A LA NUBE (Pilar D) ====================
# Neutraliza la OTA de BTicino y corta el disparador de nube, de forma
# reversible, conmutable desde HA (switch "Cloud survival"). DESACTIVADO por
# defecto. OJO: este bloque NO lo sube deploy-standard.sh; para activarlo en el
# equipo hay que añadirlo a /home/bticino/cfg/extra/configs/config.yaml.
survival:
  enabled: false
  script_path: "/home/bticino/cfg/extra/survival.sh"
  auto_apply: false   # true = aplicar al arrancar el bridge

# ==================== SALUD DEL EQUIPO ====================
# Los sensores de problema de HA (Flexisip, ruta del contestador) son de solo
# lectura y no se configuran. El vigilante de SSH sí actúa: si el servidor SSH
# lleva caído más de `grace`, lo vuelve a arrancar. DESACTIVADO por defecto.
# El botón "Arrancar SSH" de HA requiere mqtt.enable_system_buttons: true.
# OJO: este bloque NO lo sube deploy-standard.sh.
health:
  ssh_watchdog:
    enabled: false
    port: 22
    grace: 5m
    start_command: "/etc/init.d/dropbear start"
