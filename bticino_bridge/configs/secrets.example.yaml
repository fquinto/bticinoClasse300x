# bticino_bridge secrets — EXAMPLE / template.
#
# Every real credential of the bridge lives in ONE file: configs/secrets.yaml
# (next to config.yaml). It is gitignored and must never be committed.
#
#   cp configs/secrets.example.yaml configs/secrets.yaml
#   chmod 600 configs/secrets.yaml
#
# Rules:
#   - Same structure as config.yaml; its keys are overlaid on top of config.yaml
#     at startup. Key names must match exactly (unknown keys are ignored).
#   - Keep ONLY the keys you fill in. A key left as "" blanks the value from
#     config.yaml; a key left as a placeholder below counts as missing.
#   - The bridge refuses to start if a secret required by an ENABLED subsystem
#     is missing, and names the missing keys. See docs/SECRETS.md.

sip:
  domain: "YOUR_GATEWAY_ID.bs.iotleg.com"   # required when sip.enabled
  password: "REDACTED_HA1"                  # required when sip.enabled (HA1 if sip.use_ha1)

mqtt:
  username: "CHANGE_ME"
  password: "CHANGE_ME"                     # required when mqtt.enabled

homekit:
  pin: "CHANGE_ME"                          # required when homekit.enabled (8 digits)

security:
  web_username: "CHANGE_ME"
  web_password: "CHANGE_ME"                 # required when security.web_auth_required

notifications:
  telegram:
    bot_token: "CHANGE_ME"                  # required when notifications.telegram.enabled
